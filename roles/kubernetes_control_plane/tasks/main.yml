---
- name: Check if Kubernetes control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Pull Kubernetes control plane images
  ansible.builtin.command: kubeadm config images pull
  when: not kubeadm_admin_conf.stat.exists
  changed_when: true

- name: Initialize Kubernetes control plane with kubeadm
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --cri-socket={{ containerd_cri_socket }}
  when: not kubeadm_admin_conf.stat.exists
  register: kubeadm_init_result
  changed_when: true

- name: Show kubeadm init output
  ansible.builtin.debug:
    var: kubeadm_init_result.stdout_lines
  when: kubeadm_init_result is defined and kubeadm_init_result.stdout_lines is defined

- name: Ensure .kube directory exists for admin user
  ansible.builtin.file:
    path: "/home/{{ kubernetes_admin_user }}/.kube"
    state: directory
    owner: "{{ kubernetes_admin_user }}"
    group: "{{ kubernetes_admin_user }}"
    mode: "0755"

- name: Copy Kubernetes admin config to admin user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ kubernetes_admin_user }}/.kube/config"
    owner: "{{ kubernetes_admin_user }}"
    group: "{{ kubernetes_admin_user }}"
    mode: "0600"
    remote_src: true

- name: Install or update Flannel CNI plugin
  ansible.builtin.command: >
    kubectl apply -f {{ flannel_manifest_url }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_apply
  changed_when: >
    'created' in flannel_apply.stdout or
    'configured' in flannel_apply.stdout

- name: Ensure control plane can run workloads if needed
  ansible.builtin.shell: >
    kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false