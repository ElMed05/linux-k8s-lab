---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes apt repository key
  ansible.builtin.get_url:
    url: "{{ kubernetes_apt_key_url }}"
    dest: "{{ kubernetes_apt_key_tmp_path }}"
    mode: "0644"

- name: Convert Kubernetes apt key to gpg format
  ansible.builtin.command:
    cmd: "gpg --dearmor -o {{ kubernetes_apt_keyring_path }} {{ kubernetes_apt_key_tmp_path }}"
    creates: "{{ kubernetes_apt_keyring_path }}"

- name: Add Kubernetes apt repository
  ansible.builtin.copy:
    dest: "{{ kubernetes_apt_repository_file }}"
    content: "deb [signed-by={{ kubernetes_apt_keyring_path }}] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/ /\n"
    owner: root
    group: root
    mode: "0644"

- name: Update apt cache after adding Kubernetes repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name: "{{ kubernetes_packages }}"
    state: present

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true