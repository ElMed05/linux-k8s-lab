---
- name: Ensure remote data platform manifest directory exists
  ansible.builtin.file:
    path: "{{ data_platform_remote_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy data platform manifests to control plane
  ansible.builtin.copy:
    src: "{{ data_platform_local_manifest_dir }}/"
    dest: "{{ data_platform_remote_manifest_dir }}/"
    owner: root
    group: root
    mode: "0644"

- name: Apply data platform namespace
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/namespace.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_data_platform_namespace
  changed_when: >
    'created' in apply_data_platform_namespace.stdout or
    'configured' in apply_data_platform_namespace.stdout

- name: Create GHCR image pull secret
  ansible.builtin.shell: >
    kubectl create secret docker-registry ghcr-secret
    --docker-server=ghcr.io
    --docker-username={{ ghcr_username }}
    --docker-password={{ ghcr_token }}
    --namespace={{ data_platform_namespace }}
    --dry-run=client -o yaml
    | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ghcr_secret_apply
  changed_when: >
    'created' in ghcr_secret_apply.stdout or
    'configured' in ghcr_secret_apply.stdout
  no_log: true

- name: Apply PostgreSQL secret
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/postgres-secret.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_postgres_secret
  changed_when: >
    'created' in apply_postgres_secret.stdout or
    'configured' in apply_postgres_secret.stdout

- name: Apply PostgreSQL PersistentVolume
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/postgres-pv.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_postgres_pv
  changed_when: >
    'created' in apply_postgres_pv.stdout or
    'configured' in apply_postgres_pv.stdout

- name: Apply PostgreSQL PVC
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/postgres-pvc.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_postgres_pvc
  changed_when: >
    'created' in apply_postgres_pvc.stdout or
    'configured' in apply_postgres_pvc.stdout

- name: Apply PostgreSQL deployment
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/postgres-deployment.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_postgres_deployment
  changed_when: >
    'created' in apply_postgres_deployment.stdout or
    'configured' in apply_postgres_deployment.stdout

- name: Apply PostgreSQL service
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/postgres-service.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_postgres_service
  changed_when: >
    'created' in apply_postgres_service.stdout or
    'configured' in apply_postgres_service.stdout

- name: Apply Data API deployment
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/data-api-deployment.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_data_api_deployment
  changed_when: >
    'created' in apply_data_api_deployment.stdout or
    'configured' in apply_data_api_deployment.stdout

- name: Apply Data API service
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/data-api-service.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_data_api_service
  changed_when: >
    'created' in apply_data_api_service.stdout or
    'configured' in apply_data_api_service.stdout

- name: Check Data API HTTPRoute manifest diff
  ansible.builtin.command: >
    kubectl diff -f {{ data_platform_remote_manifest_dir }}/data-api-httproute.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: data_api_httproute_diff
  changed_when: false
  failed_when: data_api_httproute_diff.rc not in [0, 1]

- name: Apply Data API HTTPRoute
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/data-api-httproute.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_data_api_httproute
  changed_when: data_api_httproute_diff.rc == 1
  when: data_api_httproute_diff.rc == 1

- name: Apply Data Generator CronJob
  ansible.builtin.command: >
    kubectl apply -f {{ data_platform_remote_manifest_dir }}/data-generator-cronjob.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: apply_data_generator_cronjob
  changed_when: >
    'created' in apply_data_generator_cronjob.stdout or
    'configured' in apply_data_generator_cronjob.stdout

- name: Wait for Data API deployment rollout
  ansible.builtin.command: >
    kubectl rollout status deployment/data-api
    -n {{ data_platform_namespace }}
    --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false    

- name: Wait for PostgreSQL deployment rollout
  ansible.builtin.command: >
    kubectl rollout status deployment/{{ data_platform_postgres_deployment }}
    -n {{ data_platform_namespace }}
    --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Show data platform resources
  ansible.builtin.command: >
    kubectl get all -n {{ data_platform_namespace }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: data_platform_resources
  changed_when: false

- name: Show data platform PVCs
  ansible.builtin.command: >
    kubectl get pvc -n {{ data_platform_namespace }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: data_platform_pvcs
  changed_when: false

- name: Print data platform status
  ansible.builtin.debug:
    msg:
      - "{{ data_platform_resources.stdout_lines }}"
      - "{{ data_platform_pvcs.stdout_lines }}"