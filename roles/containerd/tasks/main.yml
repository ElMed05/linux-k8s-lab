---
- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ containerd_required_modules }}"

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Configure Kubernetes networking sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = {{ containerd_sysctl_settings['net.bridge.bridge-nf-call-iptables'] }}
      net.bridge.bridge-nf-call-ip6tables = {{ containerd_sysctl_settings['net.bridge.bridge-nf-call-ip6tables'] }}
      net.ipv4.ip_forward = {{ containerd_sysctl_settings['net.ipv4.ip_forward'] }}
    owner: root
    group: root
    mode: "0644"

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if containerd config exists
  ansible.builtin.stat:
    path: "{{ containerd_config_path }}"
  register: containerd_config_file

- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false
  when: not containerd_config_file.stat.exists

- name: Write initial containerd config
  ansible.builtin.copy:
    dest: "{{ containerd_config_path }}"
    content: "{{ containerd_default_config.stdout }}"
    owner: root
    group: root
    mode: "0644"
  when: not containerd_config_file.stat.exists
  notify: Restart containerd

- name: Enable SystemdCgroup for containerd
  ansible.builtin.replace:
    path: "{{ containerd_config_path }}"
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started