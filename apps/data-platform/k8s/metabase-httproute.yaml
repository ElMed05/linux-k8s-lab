apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metabase-route
  namespace: data-platform
spec:
  parentRefs:
    - name: demo-gateway
      namespace: nginx-gateway
  hostnames:
    - dashboard.data.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: metabase
          port: 3000