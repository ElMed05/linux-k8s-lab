apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: data-platform
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-bucket-init
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio-api:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

              mc mb --ignore-existing local/raw
              mc mb --ignore-existing local/processed
              mc mb --ignore-existing local/curated

              mc ls local