apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-route
  namespace: data-platform
spec:
  parentRefs:
    - name: demo-gateway
      namespace: nginx-gateway
  hostnames:
    - minio.data.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: minio-console
          port: 9001