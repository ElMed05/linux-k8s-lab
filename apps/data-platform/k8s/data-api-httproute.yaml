apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: data-api-route
  namespace: data-platform
spec:
  parentRefs:
    - name: demo-gateway
      namespace: nginx-gateway
  hostnames:
    - api.data.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: data-api
          port: 8000