{{- if .Values.metabase.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.metabase.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.metabase.name }}
  ports:
    - name: http
      port: {{ .Values.metabase.service.port }}
      targetPort: {{ .Values.metabase.service.port }}
{{- end }}