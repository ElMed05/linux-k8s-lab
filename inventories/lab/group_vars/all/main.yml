---
timezone: "Europe/Berlin"

base_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https
  - software-properties-common
  - unzip
  - jq

#server_hostname: "k8s-master-01"
kubernetes_minor_version: "1.36"
pod_network_cidr: "10.244.0.0/16"
kubernetes_admin_user: "devops"
cert_manager_version: "v1.20.2"

k8s_control_plane_ip: "192.168.0.202"
k8s_worker_ip: "192.168.0.173"

k8s_api_endpoint: "{{ k8s_control_plane_ip }}"
gateway_node_ip: "{{ k8s_worker_ip }}"
gateway_nodeport: 31977

data_platform_hosts:
  api: "api.data.local"
  dashboard: "dashboard.data.local"
  minio: "minio.data.local"
  argocd: "argocd.data.local"

demo_hosts:
  ingress: "demo.local"
  gateway: "gateway.demo.local"