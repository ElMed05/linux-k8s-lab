---
- name: Install ingress-nginx controller
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Add ingress-nginx Helm repository
      ansible.builtin.command: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_repo_add
      changed_when: "'has been added' in ingress_repo_add.stdout"
      failed_when:
        - ingress_repo_add.rc != 0
        - "'already exists' not in ingress_repo_add.stderr"

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Get current ingress-nginx Helm release values
      ansible.builtin.command: helm get values ingress-nginx -n ingress-nginx --all -o yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_nginx_current_values
      changed_when: false
      failed_when: false

    - name: Install or upgrade ingress-nginx
      ansible.builtin.command: >
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
        --namespace ingress-nginx
        --create-namespace
        --set controller.service.type=NodePort
        --set controller.ingressClassResource.name=nginx
        --set controller.ingressClassResource.enabled=true
        --set controller.ingressClass=nginx
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_nginx_helm_upgrade
      changed_when: >
        ingress_nginx_current_values.rc != 0 or
        'type: NodePort' not in ingress_nginx_current_values.stdout or
        'ingressClass: nginx' not in ingress_nginx_current_values.stdout

    - name: Wait for ingress-nginx controller rollout
      ansible.builtin.command: kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=180s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Show ingress-nginx pods
      ansible.builtin.command: kubectl get pods -n ingress-nginx -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_pods
      changed_when: false

    - name: Show ingress-nginx service
      ansible.builtin.command: kubectl get svc -n ingress-nginx
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_svc
      changed_when: false

    - name: Print ingress-nginx status
      ansible.builtin.debug:
        msg:
          - "{{ ingress_pods.stdout_lines }}"
          - "{{ ingress_svc.stdout_lines }}"