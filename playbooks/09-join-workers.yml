---
- name: Check worker join status
  hosts: k8s_workers
  become: true
  gather_facts: false

  tasks:
    - name: Check Kubernetes worker status
      ansible.builtin.include_role:
        name: kubernetes_worker
        tasks_from: check_status


- name: Generate Kubernetes join command only when needed
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Check if any worker needs to join
      ansible.builtin.set_fact:
        workers_need_join: >-
          {{
            groups['k8s_workers']
            | map('extract', hostvars, 'needs_kubernetes_join')
            | select('equalto', true)
            | list
            | length > 0
          }}

    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false
      no_log: true
      when: workers_need_join

    - name: Store join command as fact
      ansible.builtin.set_fact:
        worker_join_command: "{{ kubeadm_join_command.stdout }} --cri-socket={{ containerd_cri_socket }}"
      no_log: true
      when: workers_need_join

    - name: Confirm join command was generated
      ansible.builtin.debug:
        msg: "Kubernetes worker join command generated securely."
      when: workers_need_join

    - name: Confirm no join command was needed
      ansible.builtin.debug:
        msg: "All worker nodes are already part of the Kubernetes cluster. No join token was created."
      when: not workers_need_join


- name: Join worker nodes to Kubernetes cluster
  hosts: k8s_workers
  become: true
  gather_facts: false

  tasks:
    - name: Join Kubernetes worker nodes
      ansible.builtin.include_role:
        name: kubernetes_worker
        tasks_from: join
      vars:
        worker_join_command: "{{ hostvars[groups['k8s_control_plane'][0]].worker_join_command | default('') }}"