---
- name: Generate Kubernetes join command on control plane
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false
      no_log: true

    - name: Store join command as fact
      ansible.builtin.set_fact:
        worker_join_command: "{{ kubeadm_join_command.stdout }} --cri-socket=unix:///run/containerd/containerd.sock"
      no_log: true

    - name: Confirm join command was generated
      ansible.builtin.debug:
        msg: "Kubernetes worker join command generated securely."


- name: Join worker nodes to Kubernetes cluster
  hosts: k8s_workers
  become: true
  gather_facts: false

  tasks:
    - name: Check if worker already joined the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join worker node to cluster
      ansible.builtin.shell: "{{ hostvars[groups['k8s_control_plane'][0]].worker_join_command }}"
      when: not kubelet_conf.stat.exists
      register: join_result
      changed_when: true
      no_log: true

    - name: Worker joined successfully
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} joined the Kubernetes cluster successfully."
      when: not kubelet_conf.stat.exists

    - name: Worker already joined
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is already part of the Kubernetes cluster."
      when: kubelet_conf.stat.exists