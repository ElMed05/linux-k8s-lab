---
- name: Install cert-manager
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Get current cert-manager Helm release status
      ansible.builtin.command: helm list -n cert-manager --filter '^cert-manager$' -o yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cert_manager_helm_status
      changed_when: false
      failed_when: false

    - name: Install or upgrade cert-manager with Helm
      ansible.builtin.command: >
        helm upgrade --install cert-manager
        oci://quay.io/jetstack/charts/cert-manager
        --version {{ cert_manager_version }}
        --namespace cert-manager
        --create-namespace
        --set crds.enabled=true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cert_manager_helm_upgrade
      changed_when: >
        cert_manager_helm_status.rc != 0 or
        'cert-manager' not in cert_manager_helm_status.stdout or
        cert_manager_version not in cert_manager_helm_status.stdout

    - name: Wait for cert-manager deployment
      ansible.builtin.command: kubectl rollout status deployment/cert-manager -n cert-manager --timeout=180s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Wait for cert-manager cainjector deployment
      ansible.builtin.command: kubectl rollout status deployment/cert-manager-cainjector -n cert-manager --timeout=180s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Wait for cert-manager webhook deployment
      ansible.builtin.command: kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=180s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Show cert-manager pods
      ansible.builtin.command: kubectl get pods -n cert-manager -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cert_manager_pods
      changed_when: false

    - name: Show cert-manager CRDs
      ansible.builtin.command: kubectl get crd
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_crds
      changed_when: false

    - name: Print cert-manager status
      ansible.builtin.debug:
        msg:
          - "{{ cert_manager_pods.stdout_lines }}"
          - "{{ cluster_crds.stdout_lines | select('search', 'cert-manager.io') | list }}"