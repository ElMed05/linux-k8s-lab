---
- name: Verify Kubernetes cluster health
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Check containerd status
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_status
      changed_when: false

    - name: Check kubelet status
      ansible.builtin.command: systemctl is-active kubelet
      register: kubelet_status
      changed_when: false

    - name: Get Kubernetes nodes
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kubectl_nodes
      changed_when: false

    - name: Get Kubernetes system pods
      ansible.builtin.command: kubectl get pods -A
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kubectl_pods
      changed_when: false
    
    - name: Check Helm version
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    - name: Get ingress-nginx controller status
      ansible.builtin.command: kubectl get pods -n ingress-nginx -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_controller_status
      changed_when: false

    - name: Get ingress-nginx service
      ansible.builtin.command: kubectl get svc -n ingress-nginx
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_controller_service
      changed_when: false

    - name: Get demo ingress
      ansible.builtin.command: kubectl get ingress -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: demo_ingress
      changed_when: false
    
    - name: Get cert-manager pods
      ansible.builtin.command: kubectl get pods -n cert-manager -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cert_manager_pods
      changed_when: false

    - name: Get cert-manager certificate
      ansible.builtin.command: kubectl get certificate -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: demo_certificate
      changed_when: false

    - name: Get demo TLS secret
      ansible.builtin.command: kubectl get secret demo-local-tls -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: demo_tls_secret
      changed_when: false

    - name: Describe demo ingress TLS
      ansible.builtin.command: kubectl describe ingress demo-nginx -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: demo_ingress_tls
      changed_when: false

    - name: Show verification result
      ansible.builtin.debug:
        msg:
          - "containerd: {{ containerd_status.stdout }}"
          - "kubelet: {{ kubelet_status.stdout }}"
          - "helm: {{ helm_version.stdout }}"
          - "{{ kubectl_nodes.stdout_lines }}"
          - "{{ kubectl_pods.stdout_lines }}"
          - "{{ ingress_controller_status.stdout_lines }}"
          - "{{ ingress_controller_service.stdout_lines }}"
          - "{{ demo_ingress.stdout_lines }}"
          - "{{ cert_manager_pods.stdout_lines }}"
          - "{{ demo_certificate.stdout_lines }}"
          - "{{ demo_tls_secret.stdout_lines }}"
          - "{{ demo_ingress_tls.stdout_lines | select('search', 'TLS|demo-local-tls|terminates|demo.local') | list }}"