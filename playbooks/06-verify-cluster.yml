---
- name: Verify Kubernetes cluster health
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Check containerd status
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_status
      changed_when: false

    - name: Check kubelet status
      ansible.builtin.command: systemctl is-active kubelet
      register: kubelet_status
      changed_when: false

    - name: Get Kubernetes nodes
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kubectl_nodes
      changed_when: false

    - name: Get Kubernetes system pods
      ansible.builtin.command: kubectl get pods -A
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kubectl_pods
      changed_when: false
    
    - name: Check Helm version
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    - name: Get ingress-nginx controller status
      ansible.builtin.command: kubectl get pods -n ingress-nginx -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_controller_status
      changed_when: false

    - name: Get ingress-nginx service
      ansible.builtin.command: kubectl get svc -n ingress-nginx
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress_controller_service
      changed_when: false

    - name: Get demo ingress
      ansible.builtin.command: kubectl get ingress -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: demo_ingress
      changed_when: false
    
    - name: Get cert-manager pods
      ansible.builtin.command: kubectl get pods -n cert-manager -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cert_manager_pods
      changed_when: false

    - name: Get cert-manager certificate
      ansible.builtin.command: kubectl get certificate -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: demo_certificate
      changed_when: false

    - name: Get demo TLS secret
      ansible.builtin.command: kubectl get secret demo-local-tls -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: demo_tls_secret
      changed_when: false

    - name: Describe demo ingress TLS
      ansible.builtin.command: kubectl describe ingress demo-nginx -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: demo_ingress_tls
      changed_when: false

    - name: Get NGINX Gateway Fabric pods
      ansible.builtin.command: kubectl get pods -n nginx-gateway -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: gateway_pods
      changed_when: false

    - name: Get NGINX Gateway Fabric services
      ansible.builtin.command: kubectl get svc -n nginx-gateway
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: gateway_services
      changed_when: false

    - name: Get GatewayClass status
      ansible.builtin.command: kubectl get gatewayclass
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: gatewayclass_status
      changed_when: false

    - name: Get Gateway status
      ansible.builtin.command: kubectl get gateway -A
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: gateway_status
      changed_when: false

    - name: Get HTTPRoute status
      ansible.builtin.command: kubectl get httproute -n demo
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: httproute_status
      changed_when: false
    - name: Get data platform pods
      ansible.builtin.command: kubectl get pods -n data-platform -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: data_platform_pods
      changed_when: false

    - name: Get data platform services
      ansible.builtin.command: kubectl get svc -n data-platform
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: data_platform_services
      changed_when: false

    - name: Get data platform PVCs
      ansible.builtin.command: kubectl get pvc -n data-platform
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: data_platform_pvcs
      changed_when: false

    - name: Get data generator CronJob
      ansible.builtin.command: kubectl get cronjob -n data-platform
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: data_platform_cronjobs
      changed_when: false

    - name: Get data platform jobs
      ansible.builtin.command: kubectl get jobs -n data-platform
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: data_platform_jobs
      changed_when: false

    - name: Get all HTTPRoutes
      ansible.builtin.command: kubectl get httproute -A
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: all_httproutes
      changed_when: false

    - name: Check Data API health through Gateway API
      ansible.builtin.command: >
        curl -s -H "Host: api.data.local"
        http://192.168.0.173:31977/health
      register: data_api_gateway_health
      changed_when: false

    - name: Check Metabase endpoint through Gateway API
      ansible.builtin.command: >
        curl -I -s -H "Host: dashboard.data.local"
        http://192.168.0.173:31977
      register: metabase_gateway_health
      changed_when: false

    - name: Check data platform database tables
      ansible.builtin.command: >
        kubectl exec -n data-platform deploy/postgres --
        psql -U dataplatform -d dataplatform
        -c '\dt'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: data_platform_tables
      changed_when: false

    - name: Count service metrics records
      ansible.builtin.command: >
        kubectl exec -n data-platform deploy/postgres --
        psql -U dataplatform -d dataplatform
        -t -c 'SELECT COUNT(*) FROM service_metrics;'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: service_metrics_count
      changed_when: false

    - name: Count incident records
      ansible.builtin.command: >
        kubectl exec -n data-platform deploy/postgres --
        psql -U dataplatform -d dataplatform
        -t -c 'SELECT COUNT(*) FROM incidents;'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: incidents_count
      changed_when: false

    - name: Check MinIO console through Gateway API
      ansible.builtin.command: >
        curl -I -s -H "Host: minio.data.local"
        http://192.168.0.173:31977
      register: minio_gateway_health
      changed_when: false

    - name: Check MinIO buckets
      ansible.builtin.shell: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf run mc-verify-buckets
        -n data-platform
        --rm -i
        --restart=Never
        --image=minio/mc
        --env="MINIO_ROOT_USER=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf get secret minio-secret -n data-platform -o jsonpath={.data.MINIO_ROOT_USER} | base64 -d)"
        --env="MINIO_ROOT_PASSWORD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf get secret minio-secret -n data-platform -o jsonpath={.data.MINIO_ROOT_PASSWORD} | base64 -d)"
        --command -- /bin/sh -c
        "mc alias set local http://minio-api:9000 \$MINIO_ROOT_USER \$MINIO_ROOT_PASSWORD &&
        mc ls local"
      register: minio_buckets
      changed_when: false

    - name: Check MinIO raw metrics objects
      ansible.builtin.shell: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf run mc-verify-raw-metrics
        -n data-platform
        --rm -i
        --restart=Never
        --image=minio/mc
        --env="MINIO_ROOT_USER=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf get secret minio-secret -n data-platform -o jsonpath={.data.MINIO_ROOT_USER} | base64 -d)"
        --env="MINIO_ROOT_PASSWORD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf get secret minio-secret -n data-platform -o jsonpath={.data.MINIO_ROOT_PASSWORD} | base64 -d)"
        --command -- /bin/sh -c
        "mc alias set local http://minio-api:9000 \$MINIO_ROOT_USER \$MINIO_ROOT_PASSWORD &&
        mc find local/raw/metrics --maxdepth 10 | head -n 10"
      register: minio_raw_metrics
      changed_when: false
      failed_when: false

    - name: Check MinIO raw incidents objects
      ansible.builtin.shell: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf run mc-verify-raw-incidents
        -n data-platform
        --rm -i
        --restart=Never
        --image=minio/mc
        --env="MINIO_ROOT_USER=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf get secret minio-secret -n data-platform -o jsonpath={.data.MINIO_ROOT_USER} | base64 -d)"
        --env="MINIO_ROOT_PASSWORD=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf get secret minio-secret -n data-platform -o jsonpath={.data.MINIO_ROOT_PASSWORD} | base64 -d)"
        --command -- /bin/sh -c
        "mc alias set local http://minio-api:9000 \$MINIO_ROOT_USER \$MINIO_ROOT_PASSWORD &&
        mc find local/raw/incidents --maxdepth 10 | head -n 10"
      register: minio_raw_incidents
      changed_when: false
      failed_when: false

    - name: Show verification result
      ansible.builtin.debug:
        msg:
          - "containerd: {{ containerd_status.stdout }}"
          - "kubelet: {{ kubelet_status.stdout }}"
          - "helm: {{ helm_version.stdout }}"
          - "{{ kubectl_nodes.stdout_lines }}"
          - "{{ kubectl_pods.stdout_lines }}"
          - "{{ ingress_controller_status.stdout_lines }}"
          - "{{ ingress_controller_service.stdout_lines }}"
          - "{{ demo_ingress.stdout_lines }}"
          - "{{ cert_manager_pods.stdout_lines }}"
          - "{{ demo_certificate.stdout_lines }}"
          - "{{ demo_tls_secret.stdout_lines }}"
          - "{{ demo_ingress_tls.stdout_lines | select('search', 'TLS|demo-local-tls|terminates|demo.local') | list }}"
          - "{{ gateway_pods.stdout_lines }}"
          - "{{ gateway_services.stdout_lines }}"
          - "{{ gatewayclass_status.stdout_lines }}"
          - "{{ gateway_status.stdout_lines }}"
          - "{{ httproute_status.stdout_lines }}"
          - "{{ data_platform_pods.stdout_lines }}"
          - "{{ data_platform_services.stdout_lines }}"
          - "{{ data_platform_pvcs.stdout_lines }}"
          - "{{ data_platform_cronjobs.stdout_lines }}"
          - "{{ data_platform_jobs.stdout_lines }}"
          - "{{ all_httproutes.stdout_lines }}"
          - "Data API Gateway Health: {{ data_api_gateway_health.stdout }}"
          - "{{ metabase_gateway_health.stdout_lines }}"
          - "{{ data_platform_tables.stdout_lines }}"
          - "service_metrics count: {{ service_metrics_count.stdout | trim }}"
          - "incidents count: {{ incidents_count.stdout | trim }}"
          - "{{ minio_gateway_health.stdout_lines }}"
          - "{{ minio_buckets.stdout_lines }}"
          - "MinIO raw metrics sample:"
          - "{{ minio_raw_metrics.stdout_lines }}"
          - "MinIO raw incidents sample:"
          - "{{ minio_raw_incidents.stdout_lines }}"